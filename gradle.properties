org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=tensura_quests
mod_name=Tensura Quests
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.2
mod_group_id=org.bitwisemadness.tensuraquests
mod_authors=Bitwise Madness
mod_description=Custom FTB Quests task and reward types for the Tensura RPG modpack: job progression and job-slot unlocks, Infinite Dungeon milestones, economy transactions and Faction Capitals, each validated against the authoritative gameplay system that owns the state.

# The tensura-quests-api artifact version this repo compiles against, from the
# org's GitHub Packages registry. Bump deliberately: the CI resolves it on every
# build, so it must name a published version.
api_version=1.0.0-alpha.1

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
